<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDev</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="app-container">
        <div class="content">
            <h1 class="main-title">استعلام سعر البيع</h1>
            
            <div id="scan-prompt" class="prompt">يرجى مسح الباركود...</div>

            <div id="reader-container">
                <div id="reader"></div>
            </div>

            <div id="result-card" class="result-card">
                <div class="result-item">
                    <span class="label">اسم المنتج</span>
                    <span id="product-name" class="value">-</span>
                </div>
                <div class="result-item">
                    <span class="label">السعر</span>
                    <span id="product-price" class="value">-</span>
                </div>
                <div class="result-item">
                    <span class="label">الباركود</span>
                    <span id="product-barcode" class="value">-</span>
                </div>
            </div>

            <div class="loader">
                <div class="shimmer"></div>
            </div>
        </div>
        
    </div>

    <script>
        const card = document.getElementById('result-card');
        const prompt = document.getElementById('scan-prompt');
        
        const nameEl = document.getElementById('product-name');
        const priceEl = document.getElementById('product-price');
        const barcodeEl = document.getElementById('product-barcode');

        let db = {};
        let lastBarcode = null;

        async function loadData() {
            const sheetId = '1G0GS-KGmYC97NH2HcDKgzmoVVJcjaugp';
            const downloadUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;
            
            try {
                const response = await fetch(downloadUrl);
                const data = await response.text();
                
                const rows = data.split('\n');
                const startRow = 1; 
                
                const newDb = {};
                for (let i = startRow; i < rows.length; i++) {
                    const columns = rows[i].split(',');
                    if (columns.length >= 3) {
                        const barcode = columns[0].trim();
                        const name = columns[1].trim();
                        const price = columns[2].trim();
                        newDb[barcode] = { name, price: price + " د.أ" };
                    }
                }
                db = newDb;
                
                if (lastBarcode) {
                    updateDisplay(lastBarcode);
                }
                
                document.getElementById('scan-prompt').textContent = "تم تحديث البيانات. جاهز للمسح...";
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('scan-prompt').textContent = "خطأ في تحديث البيانات!";
            }
        }

        loadData();
        setInterval(loadData, 5000);

        let barcodeBuffer = '';
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                barcodeBuffer += e.key;
            } else if (e.key === 'Enter') {
                if (barcodeBuffer) {
                    processBarcode(barcodeBuffer);
                }
                barcodeBuffer = '';
            } else if (e.key === 'Escape') {
                barcodeBuffer = '';
            }
        });

        function playBeep() {
            const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
            audio.play().catch(e => console.error("Error playing sound:", e));
        }

        function processBarcode(code) {
            playBeep();
            lastBarcode = code;
            updateDisplay(code);
        }

        function updateDisplay(code) {
            prompt.classList.add('hidden');
            card.classList.remove('hidden');
            
            const product = db[code] || { name: "منتج غير معروف", price: "غير متوفر" };
            
            nameEl.textContent = product.name;
            priceEl.textContent = product.price;
            barcodeEl.textContent = code;
        }

        // Camera Scanning Logic
        let isScanning = false;
        function onScanSuccess(decodedText, decodedResult) {
            if (isScanning) return;
            
            isScanning = true;
            processBarcode(decodedText);
            
            // Wait 2 seconds before allowing another scan
            setTimeout(() => {
                isScanning = false;
            }, 2000);
        }

        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        // Start scanning with the back camera (or default)
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                console.error("Camera start error:", err);
                document.getElementById('reader-container').style.display = 'none';
            });
    </script>
</body>
</html>
